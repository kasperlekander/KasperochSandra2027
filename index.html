<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasper & Sandra 2027</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --pine:#4F632D;
    --pine-deep:#3B4A22;
    --parchment:#F2EBDA;
    --parchment-2:#EAE0C7;
    --rose:#D58198;
    --gold:#B08A4E;
    --sage:#8AA37F;
    --ink:#241F16;
    --ink-soft:#4B4536;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--pine);
    color:var(--parchment);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Texture ---------- */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.025), transparent 45%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{position:relative; z-index:1; max-width:920px; margin:0 auto; padding:0 24px 80px;}

  /* ---------- Language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:16px; right:16px;
    z-index:30;
    display:flex;
    gap:6px;
    background:rgba(59,74,34,0.55);
    backdrop-filter:blur(4px);
    padding:6px;
    border-radius:999px;
    border:1px solid rgba(242,235,218,0.25);
  }
  .lang-btn{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    background:transparent;
    border:none;
    border-radius:50%;
    cursor:pointer;
    opacity:0.55;
    transition:opacity .2s ease, background .2s ease, transform .15s ease;
  }
  .lang-btn:hover{ transform:scale(1.06); }
  .lang-btn.active{
    opacity:1;
    background:rgba(242,235,218,0.18);
    box-shadow:0 0 0 2px var(--rose) inset;
  }
  .lang-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    padding:72px 20px 40px;
  }
  .eyebrow{
    font-family:'Work Sans', sans-serif;
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:18px;
  }
  .names{
    font-family:'Cormorant Garamond', serif;
    font-size:clamp(48px, 10vw, 96px);
    line-height:1;
    font-weight:500;
    color:var(--parchment);
    margin:0;
  }
  .names .amp{
    display:inline-block;
    font-style:italic;
    color:var(--rose);
    font-size:0.75em;
    padding:0 0.08em;
  }
  .date-line{
    margin-top:22px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:26px;
    color:var(--parchment-2);
    letter-spacing:0.02em;
  }
  .sub-line{
    margin-top:6px;
    font-size:14px;
    color:var(--sage);
    letter-spacing:0.05em;
  }

  /* ---------- Photo strip ---------- */
  .photo-strip{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:34px;
    padding:0 6px;
    transform:translateX(-28px);
  }
  .photo-strip img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:6px;
    filter:grayscale(1) contrast(1.05);
    box-shadow:0 8px 18px rgba(0,0,0,0.3);
    border:2px solid rgba(242,235,218,0.5);
  }
  @media (max-width:560px){
    .photo-strip img{ width:84px; height:84px; }
    .photo-strip{ transform:translateX(-12px); }
  }

  /* Ticket perforation divider */
  .perf{
    position:relative;
    height:28px;
    margin:44px 0 0;
    background:
      radial-gradient(circle at center, var(--pine) 0 5px, transparent 6px) repeat-x;
    background-size:22px 100%;
    background-position:center;
  }
  .perf::before, .perf::after{
    content:"";
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:26px; height:26px;
    background:var(--pine-deep);
    border-radius:50%;
  }
  .perf::before{ left:-13px; }
  .perf::after{ right:-13px; }

  /* ---------- Nav ---------- */
  nav{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(var(--pine) 85%, transparent);
    padding:14px 0 10px;
  }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px 4px;
    border-bottom:1px solid rgba(242,235,218,0.15);
    padding-bottom:12px;
  }
  .tab-btn{
    font-family:'Work Sans', sans-serif;
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--parchment-2);
    background:transparent;
    border:1px solid rgba(242,235,218,0.25);
    border-radius:999px;
    padding:9px 16px;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .tab-btn:hover{ border-color:var(--rose); color:var(--parchment); }
  .tab-btn.active{
    background:var(--rose);
    border-color:var(--rose);
    color:var(--pine-deep);
    font-weight:600;
  }
  .tab-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- Cards ---------- */
  .panel{ display:none; animation:rise .35s ease; }
  .panel.active{ display:block; }
  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:4px;
    padding:38px 34px;
    margin:26px 0;
    position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,0.28);
  }

  .card h2{
    font-family:'Cormorant Garamond', serif;
    font-size:32px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--pine);
  }
  .card .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:18px;
  }
  .card p{ line-height:1.7; color:var(--ink-soft); margin:0 0 14px; }
  .card p:last-child{ margin-bottom:0; }

  .divider{ border:none; border-top:1px dashed rgba(36,31,22,0.25); margin:22px 0; }

  .fact-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
    gap:18px;
    margin-top:6px;
  }
  .fact{
    border-left:3px solid var(--rose);
    padding:4px 0 4px 14px;
  }
  .fact .k{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--gold); }
  .fact .v{ font-family:'Cormorant Garamond', serif; font-size:22px; color:var(--pine); margin-top:2px; }

  .timeline{ list-style:none; padding:0; margin:0; }
  .timeline li{
    display:flex; gap:18px;
    padding:12px 0;
    border-bottom:1px dashed rgba(36,31,22,0.18);
  }
  .timeline li:last-child{ border-bottom:none; }
  .timeline .time{
    font-family:'Cormorant Garamond', serif;
    font-size:20px; font-weight:600;
    color:var(--rose);
    min-width:78px;
  }

  ul.bullets{ margin:8px 0 0; padding-left:20px; color:var(--ink-soft); line-height:1.7; }
  ul.bullets li{ margin-bottom:6px; }

  .note{
    background:rgba(138,163,127,0.14);
    border:1px solid rgba(138,163,127,0.35);
    border-radius:4px;
    padding:14px 16px;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:16px;
  }
  .note b{ color:var(--pine); }

  /* ---------- Form ---------- */
  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:12.5px; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--pine); margin-bottom:6px; font-weight:600;
  }
  .field input[type=text], .field input[type=email], .field textarea{
    width:100%; padding:11px 13px;
    border:1px solid rgba(36,31,22,0.25);
    border-radius:3px;
    font-family:'Work Sans', sans-serif;
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .radio-row{ display:flex; gap:14px; flex-wrap:wrap; }
  .radio-row label{
    display:flex; align-items:center; gap:7px;
    font-size:14.5px; text-transform:none; letter-spacing:0; font-weight:400;
    color:var(--ink-soft); cursor:pointer;
    border:1px solid rgba(36,31,22,0.22);
    padding:9px 15px; border-radius:999px;
  }
  .radio-row input{ accent-color:var(--rose); }
  .submit-btn{
    background:var(--pine);
    color:var(--parchment);
    border:none;
    padding:13px 30px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    transition:background .2s ease;
  }
  .submit-btn:hover{ background:var(--pine-deep); }
  .submit-btn:disabled{ opacity:0.6; cursor:default; }
  .form-msg{ margin-top:14px; font-size:14px; }
  .form-msg.ok{ color:#3B6B33; }
  .form-msg.err{ color:#a13d3d; }

  footer{
    text-align:center; padding:40px 20px 10px;
    font-size:12px; letter-spacing:0.1em; color:rgba(242,235,218,0.4);
  }

  @media (prefers-reduced-motion: reduce){
    .panel{ animation:none; }
    html{ scroll-behavior:auto; }
  }

  @media (max-width:560px){
    .card{ padding:28px 20px; }
    .names{ font-size:15vw; }
    .lang-switch{ top:10px; right:10px; }
  }
</style>
</head>

let currentLang = 'sv';
let currentTab = panels[0].id;

const tabBar = document.getElementById('tabBar');
const panelsEl = document.getElementById('panels');

function renderAll(){
  tabBar.innerHTML = '';
  panelsEl.innerHTML = '';

  panels.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (p.id === currentTab ? ' active' : '');
    btn.textContent = p.label[currentLang];
    btn.dataset.id = p.id;
    btn.addEventListener('click', () => { currentTab = p.id; showPanel(p.id); });
    tabBar.appendChild(btn);

    const div = document.createElement('div');
    div.className = 'panel' + (p.id === currentTab ? ' active' : '');
    div.id = 'panel-' + p.id;
    div.innerHTML = p.render(currentLang);
    panelsEl.appendChild(div);
  });

  panels.forEach(p => { if(p.afterRender) p.afterRender(currentLang); });

  document.getElementById('heroEyebrow').textContent = i18n[currentLang].eyebrow;
  document.getElementById('heroDate').textContent = i18n[currentLang].date;
  document.getElementById('siteFooter').innerHTML = i18n[currentLang].footer;
  document.documentElement.lang = currentLang;

  document.getElementById('langSv').classList.toggle('active', currentLang === 'sv');
  document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
}

function showPanel(id){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('langSv').addEventListener('click', () => { currentLang = 'sv'; renderAll(); });
document.getElementById('langEn').addEventListener('click', () => { currentLang = 'en'; renderAll(); });

renderAll();
